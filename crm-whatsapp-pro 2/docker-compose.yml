version: '3.9'

services:
  # =============================================
  # Base de datos PostgreSQL
  # =============================================
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_whatsapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # Backend CRM
  # =============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: crm_whatsapp
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
      JWT_SECRET: ${JWT_SECRET:-cambia_este_secret_en_produccion}
      JWT_EXPIRES_IN: 7d
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAX_DIARIO: ${MAX_DIARIO:-80}
      MAX_HORA: ${MAX_HORA:-20}
      DELAY_MIN: ${DELAY_MIN:-8000}
      DELAY_MAX: ${DELAY_MAX:-20000}
      PAUSA_CADA: ${PAUSA_CADA:-15}
      PAUSA_MIN: ${PAUSA_MIN:-120000}
      PAUSA_MAX: ${PAUSA_MAX:-300000}
      SESSIONS_DIR: /app/sessions
    volumes:
      - ./sessions:/app/sessions
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    shm_size: '1gb'

volumes:
  postgres_data:
    driver: local
